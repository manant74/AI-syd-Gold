[tool:pytest]
# Configurazione pytest per il progetto AI-syd-Gold

# Directory dei test
testpaths = tests

# Pattern per i file di test
python_files = test_*.py *_test.py

# Pattern per le classi di test
python_classes = Test*

# Pattern per le funzioni di test
python_functions = test_*

# Markers personalizzati
markers =
    unit: Test unitari veloci
    integration: Test di integrazione
    performance: Test di performance
    slow: Test che richiedono molto tempo
    api: Test che richiedono connessione API

# Opzioni di default
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    -ra

# Filtri per i warning
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:langchain.*

# Directory da escludere
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    env
    __pycache__
    vector_store_cache
    pdfs

# Timeout per i test (in secondi)
timeout = 300

# Coverage
# Decommentare se si vuole abilitare il coverage
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Logging durante i test
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File di log per i test
log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Minimum version
minversion = 6.0